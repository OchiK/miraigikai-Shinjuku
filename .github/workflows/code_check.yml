name: Code Check

on:
  push:
    branches: [main]
    # docs だけの変更では走らせない。ただし docs/verification/ の台帳CSVは
    # packages/seed のテストが読むので対象に戻す。順序に意味がある（後勝ち）。
    paths:
      - "**"
      - "!docs/**"
      - "docs/verification/**"
      - "!*.md"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "docs/verification/**"
      - "!*.md"

# 同じPRへの連続pushでは古い実行を取り消す。
# main への push は sha ごとの別グループにして、待機中の実行が取り消されないようにする
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint & format check
        run: pnpm run lint

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      - name: Run build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build-check

      - name: Run Test with Coverage
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          files: ./web/coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
