# 破壊的な再シード。clearAllData() で利用者データを含む全行を削除してから投入する。
# 通常の本番更新には使わないこと。最新インベントリを届けるだけなら
# import_production.yml（非破壊 upsert）を使う。
name: Seed Production DB (DESTRUCTIVE / 破壊的)

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: latest

      - name: Fetch Supabase Keys & Run Seed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          WEB_VERCEL_DEPLOY_HOOK_URL: ${{ secrets.WEB_VERCEL_DEPLOY_HOOK_URL }}
          # run.ts はローカル以外への接続を既定で拒否する。
          # このワークフローは破壊的であることを承知した上で明示的に解除する。
          ALLOW_DESTRUCTIVE_SEED: "1"
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

          API_KEYS_JSON=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --reveal -o json)
          SERVICE_ROLE_KEY=$(echo "$API_KEYS_JSON" | jq -r '.[] | select(.name=="service_role" or .id=="service_role") | .api_key')

          if [ -z "$SERVICE_ROLE_KEY" ] || [ "$SERVICE_ROLE_KEY" = "null" ]; then
            echo "Failed to retrieve service_role key from Supabase CLI"
            exit 1
          fi

          echo "🌱 Seeding production database..."
          SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          pnpm --filter @mirai-gikai/seed seed

          echo "🚀 Triggering Vercel rebuild..."
          curl -X POST "$WEB_VERCEL_DEPLOY_HOOK_URL"
          echo "Done!"
