# 本番DBへの非破壊インポート。
#
# 自然キー（slug / label / (bill_id, difficulty_level)）で upsert するため、
# bills.id が保たれ、インタビュー回答・レポート・チャット履歴は一切削除されない。
# 破壊的な再シードが必要なときだけ seed_production.yml を使うこと。
name: Import Production DB (非破壊)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "差分の確認のみ（DBへ書き込まない）"
        type: boolean
        default: true
      confirm:
        description: "本番へ反映する場合は apply と入力"
        type: string
        default: ""

# 二重起動で同時に本番へ upsert が走らないようにする
concurrency:
  group: import-production
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: latest

      - name: Link Supabase project & fetch service_role key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

          API_KEYS_JSON=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --reveal -o json)
          SERVICE_ROLE_KEY=$(echo "$API_KEYS_JSON" | jq -r '.[] | select(.name=="service_role" or .id=="service_role") | .api_key')

          if [ -z "$SERVICE_ROLE_KEY" ] || [ "$SERVICE_ROLE_KEY" = "null" ]; then
            echo "Failed to retrieve service_role key from Supabase CLI"
            exit 1
          fi

          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"

      # 反映するかどうかに関わらず、まず差分をログに残す
      - name: Dry run
        run: pnpm --filter @mirai-gikai/seed import:production:dry-run

      - name: Check confirmation
        if: ${{ inputs.dry_run == false && inputs.confirm != 'apply' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          echo "本番へ反映するには confirm に apply を入力すること（入力値: '$CONFIRM'）"
          exit 1

      # 書き込みの前に必ずバックアップを取る。復旧手順は docs/DATA_PIPELINE.md を参照。
      #
      # 対象はインポーターが書き換える一次資料層だけに絞る。
      # 全テーブルをダンプすると、インタビュー回答やチャット本文が
      # artifact としてダウンロード可能な形で外に出てしまう。
      - name: Backup primary-source tables
        if: ${{ inputs.dry_run == false && inputs.confirm == 'apply' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db dump --data-only -f backup-data.sql \
            -t public.council_sessions \
            -t public.tags \
            -t public.bills \
            -t public.bill_contents \
            -t public.bills_tags

      - name: Upload backup artifact
        if: ${{ inputs.dry_run == false && inputs.confirm == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-primary-source-backup-${{ github.run_id }}
          path: backup-data.sql
          retention-days: 14

      - name: Import inventory
        if: ${{ inputs.dry_run == false && inputs.confirm == 'apply' }}
        run: pnpm --filter @mirai-gikai/seed import:production

      # unstable_cache の revalidate: 600 があるため、再デプロイだけでは
      # 最大10分ほど古い一覧が残る。タグを明示的に落としてから再デプロイする。
      - name: Invalidate bills cache
        if: ${{ inputs.dry_run == false && inputs.confirm == 'apply' }}
        env:
          WEB_PUBLIC_URL: ${{ secrets.WEB_PUBLIC_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$WEB_PUBLIC_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "WEB_PUBLIC_URL / REVALIDATE_SECRET が未設定のためキャッシュ無効化をスキップした"
            exit 0
          fi

          curl -fsS -X POST "${WEB_PUBLIC_URL%/}/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"tags":["bills","council-sessions"]}'

      - name: Trigger Vercel rebuild
        if: ${{ inputs.dry_run == false && inputs.confirm == 'apply' }}
        run: curl -fsS --retry 3 -X POST "${{ secrets.WEB_VERCEL_DEPLOY_HOOK_URL }}"
